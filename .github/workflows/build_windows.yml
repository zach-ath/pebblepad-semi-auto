name: Build Windows Executable

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build Executable with PyInstaller
      run: |
        pyinstaller --noconfirm --onedir --collect-submodules playwright --collect-data playwright --add-data "regex_rules.json;." gui_launcher.py

    - name: Compress Build Artifact
      run: |
        Compress-Archive -Path dist\gui_launcher\* -DestinationPath P3A_Windows_x64.zip

    - name: Upload Windows Executable Artifact
      uses: actions/upload-artifact@v4
      with:
        name: P3A-Windows-Executable
        path: P3A_Windows_x64.zip